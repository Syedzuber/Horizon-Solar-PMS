{% comment %}
One row of the group order's line table — the ONLY copy of this markup.

Drawn three times from the same include: for an aggregated catalogue line, for a
hand-added line a refused submission is giving back, and once inside a <template> as
the prototype "Add a line" clones. That is why the prototype's identity fields are the
tokens __PK__ / __CODE__ / __DESC__ / __UNIT__ — the browser substitutes them and gets
markup identical to the server's, rather than building a row of its own that would
quietly drift from this one.

Needs `row` (order_views._line_row_shape, or a line_rows entry).

ONLY QUANTITY AND AMOUNT ARE POSTED. The rate input carries NO name attribute on
purpose: it is a convenience for working out the amount, and VendorOrderLine stores a
quantity and an amount. Giving it a name would be the first step towards a third
number the record does not hold.
{% endcomment %}
<tr class="js-vo-line{% if row.hand %} js-vo-hand{% else %} d-none{% endif %}"
    data-master="{{ row.master_id }}"
    data-contrib="{{ row.contrib }}"
    {% if row.hand %}data-hand="1"{% endif %}>
  <td class="align-middle">
    <input class="form-check-input js-vo-check" type="checkbox" name="line"
           value="{{ row.master_id }}"{% if row.checked %} checked{% endif %}
           aria-label="Include this item">
  </td>
  <td class="align-middle">
    <div class="fw-semibold js-vo-code">{{ row.code }}</div>
    <div class="text-muted js-vo-desc" style="font-size:.75rem;">{{ row.description }}</div>
  </td>
  <td class="align-middle text-muted js-vo-unit">{{ row.unit }}</td>
  <td class="align-middle text-end">
    {% if row.hand %}
      <span class="text-muted">—</span>
    {% else %}
      <span class="js-vo-agg">—</span>
      <div class="text-muted js-vo-sites" style="font-size:.7rem;"></div>
    {% endif %}
  </td>
  <td>
    <input type="number" step="0.01" min="0.01" inputmode="decimal"
           class="form-control form-control-sm js-vo-qty" name="qty_{{ row.master_id }}"
           value="{{ row.qty }}" aria-label="Quantity">
  </td>
  <td>
    <input type="number" step="0.01" min="0.01" inputmode="decimal"
           class="form-control form-control-sm js-vo-rate" value=""
           placeholder="Rate" aria-label="Rate per unit">
  </td>
  <td>
    <input type="number" step="0.01" min="0.01" inputmode="decimal"
           class="form-control form-control-sm js-vo-amount" name="amount_{{ row.master_id }}"
           value="{{ row.amount }}" aria-label="Amount">
  </td>
</tr>
