{% extends "base.html" %}
{% block title %}Assign Task — {{ project.project_id }}{% endblock %}

{% block content %}
<div class="mb-3">
  <a href="{% url 'project_overview' project.project_id %}" class="text-decoration-none text-muted">&larr; Back to {{ project.project_id }}</a>
</div>

<div class="card shadow-sm" style="max-width:520px;">
  <div class="card-header">
    <h5 class="mb-0">Assign Task</h5>
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% include 'projects/partials/_task_assign_fields.html' %}
      <div class="d-flex gap-2">
        <button type="submit" id="taskAssignSaveBtn" class="btn btn-primary btn-sm">Save</button>
        <a href="{% url 'project_overview' project.project_id %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script>
document.querySelector('form').addEventListener('submit', function () {
  var btn = document.getElementById('taskAssignSaveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
});
</script>
{% endblock %}
