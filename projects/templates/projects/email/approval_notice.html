{% autoescape on %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ subject }}</title>
</head>
<!--
  Approval email (Approvals 2b): every approval notice that emails shares it. The event is
  in `subject`. Layout as design_change_request.html: table layout and inline styles only,
  because email clients strip <style>; 600px wide at most, shrinking on a phone.
  AUTOESCAPED: `body` carries a request title and `quote` a note, both typed by users.
  `url` is the ONLY absolute link in the message, built by approval_notices.email_html()
  with utils._abs_url(). The plain-text part (send_notification's `message`) carries no
  URL, because the same string is the in-app bell text.
  `lines_summary` (material lines, 28 Sep 2026): what a material request is about, e.g.
  "120 Nos - Solar module 540W, +2 more" (with a dash), from
  approval_notices.lines_summary(). A row of its own under the body, in the same table
  layout and inline styles; absent when empty. The plain-text part carries the same
  summary on a line of its own, added by approval_notices._send.
  `summary_label` (contractor bills 4a-2) names the row: the material label, or for a
  bill the bill label, whose summary is contractor, site, bill number and amount from
  approval_notices.bill_summary(). Never a file or a link to one.
-->
<body style="margin:0; padding:0; background-color:#f4f6f8;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f8; padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px; background-color:#ffffff; border-radius:10px; overflow:hidden; border:1px solid #e5e9ee;">
          <tr>
            <td style="background-color:#0f4c81; padding:24px 28px;">
              <div style="font-family:Arial,Helvetica,sans-serif; font-size:20px; font-weight:bold; color:#ffffff;">Horizon Solar</div>
              <div style="font-family:Arial,Helvetica,sans-serif; font-size:13px; color:#cfe0f0; margin-top:4px;">{{ subject }}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 28px 8px 28px; font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:1.5; color:#22303c;">
              {{ body }}
            </td>
          </tr>
          {% if lines_summary %}
          <tr>
            <td style="padding:0 28px 8px 28px; font-family:Arial,Helvetica,sans-serif; font-size:14px; line-height:1.5; color:#22303c;">
              <span style="color:#5b6b7a;">{{ summary_label }}:</span> {{ lines_summary }}
            </td>
          </tr>
          {% endif %}
          {% if quote %}
          <tr>
            <td style="padding:8px 28px; font-family:Arial,Helvetica,sans-serif; font-size:13px; font-weight:bold; color:#22303c;">
              {{ quote_label }}
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 16px 28px;">
              <div style="border-left:3px solid #0f4c81; padding:8px 14px; background-color:#f4f6f8; font-family:Arial,Helvetica,sans-serif; font-size:14px; line-height:1.5; color:#22303c; white-space:pre-wrap;">{{ quote }}</div>
            </td>
          </tr>
          {% endif %}
          <tr>
            <td style="padding:8px 28px 28px 28px;">
              <a href="{{ url }}" style="display:inline-block; background-color:#0f4c81; color:#ffffff; font-family:Arial,Helvetica,sans-serif; font-size:14px; text-decoration:none; padding:11px 22px; border-radius:6px;">Open the approval</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>{% endautoescape %}
