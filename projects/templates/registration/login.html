{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Horizon PMS — Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'horizon-green': {
              DEFAULT: '#1a7a4a',
              light: '#7cb847',
              50: '#eef8f0',
              100: '#d7eedd',
              600: '#1a7a4a',
              700: '#155f3a',
            },
            'horizon-gold': {
              DEFAULT: '#f0a829',
              light: '#efc938',
              50: '#fef8ec',
              100: '#fcecc7',
              600: '#f0a829',
              700: '#c98816',
            },
          }
        }
      }
    }
  </script>
  <style>
    /* Prevent iOS zoom on input focus */
    input { font-size: 16px; }

    /* Soft ambient background — light, not dark, subtle brand-color presence */
    .auth-bg {
      background-color: #fafaf8;
      background-image:
        radial-gradient(circle at 12% 18%, rgba(26, 122, 74, 0.07), transparent 38%),
        radial-gradient(circle at 88% 82%, rgba(240, 168, 41, 0.09), transparent 42%);
    }
  </style>
</head>
<body class="auth-bg min-h-screen flex flex-col">

  <!-- Top accent bar — same 3px brand gradient used across the app -->
  <div class="h-[3px] bg-gradient-to-r from-horizon-green to-horizon-gold"></div>

  <main class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-[380px]">

      <!-- Logo -->
      <div class="flex justify-center mb-8">
        <img src="{% static 'images/horizon-logo.png' %}" alt="Horizon Renewable Power"
             class="h-8 w-auto">
      </div>

      <!-- Auth card -->
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sm:p-7">

        <div class="mb-6">
          <h1 class="text-lg font-semibold text-slate-800">Sign in</h1>
          <p class="text-sm text-slate-500 mt-1">Horizon Project Management System</p>
        </div>

        {% if messages %}
          {% for message in messages %}
            <div class="mb-4 px-3 py-2.5 rounded-lg bg-red-50 border border-red-100 text-sm text-red-700 flex items-start gap-2">
              <i data-lucide="alert-circle" class="w-4 h-4 mt-0.5 flex-shrink-0"></i>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'login' %}" novalidate>
          {% csrf_token %}

          <div class="mb-4">
            <label for="id_username" class="block text-xs font-medium text-slate-600 mb-1.5">
              Username
            </label>
            <input
              type="text"
              name="username"
              id="id_username"
              autocomplete="username"
              required
              autofocus
              class="w-full min-h-[44px] px-3.5 py-2.5 rounded-lg border border-slate-300
                     text-slate-800 placeholder:text-slate-400
                     focus:outline-none focus:ring-2 focus:ring-horizon-green-600/20 focus:border-horizon-green-600
                     transition-colors"
              placeholder="Ashish">
          </div>

          <div class="mb-5">
            <label for="id_password" class="block text-xs font-medium text-slate-600 mb-1.5">
              Password
            </label>
            <div class="relative">
              <input
                type="password"
                name="password"
                id="id_password"
                autocomplete="current-password"
                required
                class="w-full min-h-[44px] px-3.5 py-2.5 pr-11 rounded-lg border border-slate-300
                       text-slate-800 placeholder:text-slate-400
                       focus:outline-none focus:ring-2 focus:ring-horizon-green-600/20 focus:border-horizon-green-600
                       transition-colors"
                placeholder="••••••••">
              <button type="button"
                      onclick="const i=this.previousElementSibling; i.type = i.type === 'password' ? 'text' : 'password'; this.querySelector('i').setAttribute('data-lucide', i.type === 'password' ? 'eye' : 'eye-off'); lucide.createIcons();"
                      class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <button type="submit"
                  class="w-full min-h-[44px] bg-horizon-green-600 hover:bg-horizon-green-700
                         text-white text-sm font-medium rounded-lg
                         flex items-center justify-center gap-2 transition-colors">
            Sign in
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </form>

      </div>

      <p class="text-center text-xs text-slate-400 mt-6">
        Horizon Renewable Power · Internal use only
      </p>

    </div>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
