<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SolarPMS — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f6f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
    }
    .login-header {
      background-color: #212529;
      color: #fff;
      padding: 1.5rem;
      border-radius: 0.5rem 0.5rem 0 0;
      text-align: center;
    }
    .login-header h4 { margin: 0; font-weight: 700; letter-spacing: 0.5px; }
    .login-header p  { margin: 0.25rem 0 0; font-size: 0.85rem; color: #adb5bd; }
  </style>
</head>
<body>

<div class="login-card shadow">
  <div class="login-header">
    <h4>Horizon Solar</h4>
    <p>Project Management System</p>
  </div>
  <div class="card border-0 rounded-0 rounded-bottom">
    <div class="card-body p-4">

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-danger py-2">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="id_username" class="form-label fw-semibold">Username</label>
          <input
            type="text"
            id="id_username"
            name="username"
            class="form-control"
            autofocus
            autocomplete="username"
          >
        </div>
        <div class="mb-4">
          <label for="id_password" class="form-label fw-semibold">Password</label>
          <input
            type="password"
            id="id_password"
            name="password"
            class="form-control"
            autocomplete="current-password"
          >
        </div>
        <button type="submit" class="btn btn-dark w-100">Sign In</button>
      </form>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
