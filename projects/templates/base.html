<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SolarPMS{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
  </style>
</head>
<body>

{% if user.is_authenticated %}
<nav class="navbar navbar-dark bg-dark px-4">
  <span class="navbar-brand">Horizon Solar — PMS</span>
  <div class="d-flex align-items-center gap-3">
    <span class="text-white-50 small">{{ user.get_full_name|default:user.username }}</span>
    <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-light">Logout</a>
  </div>
</nav>
{% endif %}

<div class="container mt-4">

  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
